name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Veil.app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Derive version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Fetch core binaries
        run: |
          Scripts/fetch-xray.sh
          Scripts/fetch-singbox.sh
          Scripts/fetch-tun2socks.sh

      - name: Build & test
        run: |
          swift build -c release
          swift test

      - name: Package Veil.app
        run: Scripts/package-app.sh "${{ steps.version.outputs.version }}"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Veil ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: dist/Veil.app.zip
