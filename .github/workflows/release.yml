name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Veil.app
    # macos-26 (Tahoe) ships the macOS 26 SDK. Linking against it is what
    # enables the modern Liquid Glass / Tahoe look — an app built against the
    # macOS 15 SDK renders in legacy style even when run on macOS 26+.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode (macOS 26 SDK)
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Show toolchain
        run: |
          swift --version
          xcrun --show-sdk-version

      - name: Derive version from tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The VERSION file is what the app bakes into its bundle, so a tag
          # that disagrees with it would ship a build labelled with the wrong
          # version. Fail early instead: run Scripts/set-version.sh and commit.
          file_version="$(cat VERSION)"
          if [ "$version" != "$file_version" ]; then
            echo "::error::tag v$version does not match VERSION ($file_version)."
            echo "::error::Run Scripts/set-version.sh $version, commit, then re-tag."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Fetch core binaries
        run: |
          Scripts/fetch-xray.sh
          Scripts/fetch-singbox.sh
          Scripts/fetch-tun2socks.sh

      - name: Build & test
        run: |
          # Swift 6.3.x on the macos-26 runner has a whole-module-optimization
          # regression that makes the release build of this module take ~25 min
          # (the same code compiles in ~25s on Swift 6.4). Disabling WMO drops
          # the build back to a couple of minutes at the cost of some
          # cross-module inlining. Remove once the runner ships Swift >= 6.4.
          swift build -c release -Xswiftc -no-whole-module-optimization
          swift test

      - name: Package Veil.app
        run: Scripts/package-app.sh "${{ steps.version.outputs.version }}"

      # The release body is the CHANGELOG section for this version, so what a
      # user reads on the release page is the text that was reviewed in the PR
      # rather than a list of commit subjects.
      - name: Extract the changelog section
        run: |
          version="${{ steps.version.outputs.version }}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $version."
            exit 1
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Veil ${{ steps.version.outputs.version }}
          body_path: release-notes.md
          generate_release_notes: true
          files: dist/Veil.app.zip
