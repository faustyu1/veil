# Pinned core binaries: core arch version sha256
#
# Every line pins one release asset. The fetch-*.sh scripts refuse to install a
# download whose SHA-256 does not match the hash recorded here.
#
# This file is empty on purpose: the hashes have to be produced on a machine
# that can reach GitHub's release assets. Record them once, per architecture,
# and commit the result:
#
#     RECORD_HASHES=1 Scripts/fetch-xray.sh
#     RECORD_HASHES=1 Scripts/fetch-singbox.sh
#     RECORD_HASHES=1 Scripts/fetch-tun2socks.sh
#
# Until a core is listed here the fetch scripts still work, but they print a
# warning: an unpinned core is exactly the supply-chain hole this file closes.
